name: Build & Release (macOS)

# 每次 push（含 tag）都触发：编译 Mac 版 -> 启动冒烟测试 -> 打包 .app -> 发布 Release
on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  APP_NAME: PlayerMaster
  BIN: nsh-app-playermaster

jobs:
  # ---------------------------------------------------------------------------
  # 1) 在 macOS runner 上原生编译两个架构：Apple Silicon + Intel
  # ---------------------------------------------------------------------------
  build:
    name: Build & smoke-test (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: apple-silicon
            runner: macos-latest
            target: aarch64-apple-darwin
          - label: intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify binary
        run: |
          BIN="target/${{ matrix.target }}/release/${{ env.BIN }}"
          test -x "$BIN"
          file "$BIN"
          echo "Binary built successfully: $BIN"

      # 无头 CI 里 AppKit 窗口无法交互，但可以验证进程能正常启动、事件循环不崩溃。
      # 启动后存活 5 秒即视为冒烟测试通过，然后主动结束进程。
      - name: Smoke test (launch app for 5s)
        run: |
          BIN="target/${{ matrix.target }}/release/${{ env.BIN }}"
          "$BIN" > /tmp/pm-smoke.log 2>&1 &
          PID=$!
          sleep 5
          if kill -0 "$PID" 2>/dev/null; then
            echo "SMOKE TEST PASS: app stayed alive for 5s (event loop running)."
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          else
            echo "SMOKE TEST FAIL: app exited early."
            echo "----- app log -----"
            cat /tmp/pm-smoke.log || true
            exit 1
          fi

      - name: Assemble .app bundle
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/${{ env.BIN }}"
          APP="${{ env.APP_NAME }}.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN" "$APP/Contents/MacOS/$BIN"
          chmod +x "$APP/Contents/MacOS/$BIN"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>PlayerMaster</string>
            <key>CFBundleDisplayName</key><string>PlayerMaster</string>
            <key>CFBundleIdentifier</key><string>com.example.playermaster</string>
            <key>CFBundleExecutable</key><string>nsh-app-playermaster</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          tar -czf "PlayerMaster-macos-${{ matrix.label }}.tar.gz" "$APP"
          ls -lh "PlayerMaster-macos-${{ matrix.label }}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.label }}
          path: PlayerMaster-macos-${{ matrix.label }}.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2) 聚合所有架构产物，发布/更新滚动的 latest Release
  # ---------------------------------------------------------------------------
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist/

      - name: Publish rolling 'latest' Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "PlayerMaster macOS — latest"
          body: |
            Automated build from commit `${{ github.sha }}` on branch/tag `${{ github.ref_name }}`.

            Each push rebuilds, runs a launch smoke test, and updates this release.

            Assets:
            - `PlayerMaster-macos-apple-silicon.tar.gz` — Apple Silicon (M1/M2/M3)
            - `PlayerMaster-macos-intel.tar.gz` — Intel Mac

            Extract and run: `tar -xzf PlayerMaster-macos-*.tar.gz && open PlayerMaster.app`
          prerelease: true
          files: dist/*.tar.gz
          generate_release_notes: false
